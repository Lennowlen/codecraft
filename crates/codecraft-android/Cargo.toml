[package]
name = "codecraft-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
codecraft-core = { path = "../codecraft-core" }
codecraft-ui = { path = "../codecraft-ui" }
codecraft-toolchain = { path = "../codecraft-toolchain" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = "0.36"
android-activity = { version = "0.6", features = ["native-activity"] }
log = "0.4"
android_logger = "0.14"
jni = "0.21"

[package.metadata.android]
package = "ai.storyteller.codecraft"
apk_name = "CodeCraft"
app_name = "CodeCraft"
label = "CodeCraft"
target_sdk_version = 34
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]

